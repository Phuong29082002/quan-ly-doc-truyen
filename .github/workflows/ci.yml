# PB56: mỗi lần push hoặc tạo pull request, tự build và chạy kiểm thử cho API, Web và Android
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API (.NET) build và test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore QuanLyDocTruyen.slnx
      - run: dotnet build QuanLyDocTruyen.slnx --no-restore -c Release
      - run: dotnet test QuanLyDocTruyen.slnx --no-build -c Release --logger "trx;LogFileName=ket-qua.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ket-qua-test-api
          path: "**/TestResults/*.trx"

  web:
    name: Web lint, build và kiểm thử giao diện
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bao-cao-playwright
          path: web/playwright-report

  android:
    name: Android build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: mobile/app/build/outputs/apk/debug/*.apk

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
